version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto_timescaledb
    environment:
      POSTGRES_DB: crypto_market_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_market_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  engine:
    build: .
    container_name: crypto_data_engine
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - DB_NAME=crypto_market_data
      - SOCKS5_PROXY=
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: always
    command: python main.py run

  dashboard:
    build: .
    container_name: crypto_dashboard
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - DB_NAME=crypto_market_data
    ports:
      - "8501:8501"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: always
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  timescale_data:
