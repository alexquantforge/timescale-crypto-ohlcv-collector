[tool.poetry]
name = "timescale-crypto-ohlcv-collector"
version = "0.1.0"
description = "Async Crypto Market Data Collector (Perp-First & Spot) with Filtered ATR (w/o Paranormal Bars), L2 Orderbook Depth & TimescaleDB Storage"
authors = ["Developer <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
asyncpg = "^0.31.0"
ccxt = "^4.5.74"
aiohttp-socks = "^0.8.4"
pandas = "^2.2.0"
numpy = "^2.0.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
streamlit = "^1.40.0"
plotly = "^5.24.0"
typer = "^0.15.0"
rich = "^13.9.0"
python-dotenv = "^1.0.0"
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
